name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet, build, test and race
        run: make check
      - name: Replay must be byte identical
        run: make replay
      - name: Coverage summary
        run: make cover
