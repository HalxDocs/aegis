version: 2

# The Go module has no dependencies today and the workflows use pinned actions,
# so this exists to notice the day either of those stops being true: an action
# whose major version moves, or a dependency that gets added and then forgotten.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/examples/consumer"
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
